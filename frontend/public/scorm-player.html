<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor SCORM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #011932; }
  body { display: flex; flex-direction: column; font-family: 'Poppins', sans-serif; }

  .player-bar {
    flex-shrink: 0; height: 44px;
    background: #01264C; border-bottom: 1px solid rgba(25,247,241,.15);
    display: flex; align-items: center; gap: 14px; padding: 0 16px;
  }
  .player-logo { display: flex; align-items: center; gap: 7px; }
  .player-logo-text { font-size: 13px; font-weight: 800; color: #D9FBFF; letter-spacing: -.02em; }
  .divider { width: 1px; height: 20px; background: rgba(25,247,241,.15); flex-shrink: 0; }
  .player-title { font-size: 12px; color: #72A3C4; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-badge {
    background: rgba(15,206,211,.12); border: 1px solid rgba(15,206,211,.3);
    color: #0FCED3; border-radius: 20px; padding: 2px 12px;
    font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; flex-shrink: 0;
  }
  .scorm-frame { flex: 1; border: none; width: 100%; background: white; }
  .status-bar {
    flex-shrink: 0; height: 26px;
    background: #011932; border-top: 1px solid rgba(25,247,241,.08);
    display: flex; align-items: center; padding: 0 16px; gap: 16px;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #19F7A0; animation: pulse 2s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .status-text { font-size: 10px; color: #72A3C4; font-weight: 500; flex: 1; }
  .error-box { margin: auto; color: #D9FBFF; font-size: 14px; text-align: center; padding: 2rem; }

  /* Panel flotante con el historial de llamadas a la API SCORM — visto en
     QA que el status-bar de una sola línea (solo la última llamada, sin
     argumentos) era casi imposible de seguir durante la navegación. */
  .api-log-panel {
    position: absolute; bottom: 34px; right: 10px; z-index: 5;
    width: 320px; max-height: 160px; overflow-y: auto;
    background: rgba(1, 25, 50, 0.92); border: 1px solid rgba(25,247,241,.2);
    border-radius: 8px; padding: 8px 10px;
    font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.5;
  }
  .api-log-panel .ok { color: #19F7A0; }
  .api-log-panel .err { color: #F75A50; }
</style>
</head>
<body>
  <div class="player-bar">
    <span class="player-logo">
      <svg width="22" height="22" viewBox="0 0 26 26" fill="none">
        <path d="M13 2L25 23H1L13 2Z" fill="none" stroke="#0FCED3" stroke-width="2" stroke-linejoin="round"/>
        <path d="M7 17L13 7L19 17" fill="none" stroke="#19F7F1" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <span class="player-logo-text">awakelab</span>
    </span>
    <div class="divider"></div>
    <span class="player-title" id="courseTitle">Curso SCORM</span>
    <span class="player-badge">SCORM Player</span>
  </div>

  <div id="playerBody" style="flex:1; display:flex; min-height:0; position: relative;">
    <iframe
      id="scormFrame"
      class="scorm-frame"
      allow="fullscreen"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock allow-downloads"
    ></iframe>
    <div class="api-log-panel" id="apiLogPanel"></div>
  </div>

  <div class="status-bar">
    <div class="status-dot"></div>
    <span class="status-text">LMS emulado · SCORM 1.2 + 2004 (sin guardado de progreso)</span>
  </div>

<script>
/* ── SCORM 1.2 API ────────────────────────────────────────── */
// Valores por defecto obligatorios — evita que el curso rechace al usuario
// como "anónimo". Este reproductor no persiste cmi.* en ningún sitio: es
// una vista previa/visualizador, no un LMS real con seguimiento de notas.
const scormData = {
  'cmi.core.student_id'      : 'preview_user',
  'cmi.core.student_name'    : 'Usuario Preview',
  'cmi.core.lesson_status'   : 'not attempted',
  'cmi.core.credit'          : 'credit',
  'cmi.core.entry'           : 'ab-initio',
  'cmi.core.lesson_mode'     : 'normal',
  'cmi.core.score.raw'       : '',
  'cmi.core.score.min'       : '0',
  'cmi.core.score.max'       : '100',
  'cmi.core.total_time'      : '0000:00:00.00',
  'cmi.core.session_time'    : '0000:00:00.00',
  'cmi.suspend_data'         : '',
  'cmi.launch_data'          : '',
  'cmi.student_preference.language': '',
  'cmi.student_preference.audio'   : '0',
  'cmi.student_preference.speed'   : '0',
  'cmi.student_preference.text'    : '0',
};

// Estado real de inicialización — un SCO en SCORM 1.2 solo puede llamar
// GetValue/SetValue/Commit entre un LMSInitialize() y el LMSFinish()
// correspondiente; fuera de esa ventana, un LMS real devuelve "false" y un
// código de error. Antes esto no se comprobaba y todo devolvía "true"
// siempre, incluso después de Finish — visto en QA, podía esconder un bug
// real que luego fallara en un Moodle de verdad.
let scorm12Initialized = false;
let lastError12 = '0';

window.API = {
  LMSInitialize: function () {
    if (scorm12Initialized) { lastError12 = '101'; logCall('LMSInitialize()', false, 'ya estaba inicializado'); return 'false'; }
    scorm12Initialized = true;
    lastError12 = '0';
    logCall('LMSInitialize()', true);
    return 'true';
  },
  LMSFinish: function () {
    if (!scorm12Initialized) { lastError12 = '301'; logCall('LMSFinish()', false, 'no inicializado'); return 'false'; }
    scorm12Initialized = false;
    lastError12 = '0';
    logCall('LMSFinish()', true);
    return 'true';
  },
  LMSGetValue: function (k) {
    if (!scorm12Initialized) { lastError12 = '301'; logCall('LMSGetValue(' + k + ')', false, 'no inicializado'); return ''; }
    const v = (k in scormData) ? scormData[k] : '';
    lastError12 = '0';
    logCall('LMSGetValue(' + k + ') → ' + v, true);
    return v;
  },
  LMSSetValue: function (k, v) {
    if (!scorm12Initialized) { lastError12 = '301'; logCall('LMSSetValue(' + k + ', ' + v + ')', false, 'no inicializado'); return 'false'; }
    scormData[k] = v;
    lastError12 = '0';
    logCall('LMSSetValue(' + k + ', ' + v + ')', true);
    return 'true';
  },
  LMSCommit: function () {
    if (!scorm12Initialized) { lastError12 = '301'; logCall('LMSCommit()', false, 'no inicializado'); return 'false'; }
    lastError12 = '0';
    logCall('LMSCommit()', true);
    return 'true';
  },
  LMSGetLastError: function () { return lastError12; },
  LMSGetErrorString: function () { return ''; },
  LMSGetDiagnostic: function () { return ''; },
};

/* ── SCORM 2004 API ───────────────────────────────────────── */
const scormData2004 = {
  'cmi.learner_id'          : 'preview_user',
  'cmi.learner_name'        : 'Usuario Preview',
  'cmi.completion_status'   : 'not attempted',
  'cmi.success_status'      : 'unknown',
  'cmi.credit'              : 'credit',
  'cmi.entry'               : 'ab-initio',
  'cmi.mode'                : 'normal',
  'cmi.score.raw'           : '',
  'cmi.score.min'           : '0',
  'cmi.score.max'           : '100',
  'cmi.total_time'          : 'PT0S',
  'cmi.suspend_data'        : '',
  'cmi.launch_data'         : '',
};

let scorm2004Initialized = false;
let lastError2004 = '0';

window.API_1484_11 = {
  Initialize: function () {
    if (scorm2004Initialized) { lastError2004 = '103'; logCall('[2004] Initialize()', false, 'ya estaba inicializado'); return 'false'; }
    scorm2004Initialized = true;
    lastError2004 = '0';
    logCall('[2004] Initialize()', true);
    return 'true';
  },
  Terminate: function () {
    if (!scorm2004Initialized) { lastError2004 = '112'; logCall('[2004] Terminate()', false, 'no inicializado'); return 'false'; }
    scorm2004Initialized = false;
    lastError2004 = '0';
    logCall('[2004] Terminate()', true);
    return 'true';
  },
  GetValue: function (k) {
    if (!scorm2004Initialized) { lastError2004 = '122'; logCall('[2004] GetValue(' + k + ')', false, 'no inicializado'); return ''; }
    const v = (k in scormData2004) ? scormData2004[k] : '';
    lastError2004 = '0';
    logCall('[2004] GetValue(' + k + ') → ' + v, true);
    return v;
  },
  SetValue: function (k, v) {
    if (!scorm2004Initialized) { lastError2004 = '132'; logCall('[2004] SetValue(' + k + ', ' + v + ')', false, 'no inicializado'); return 'false'; }
    scormData2004[k] = v;
    lastError2004 = '0';
    logCall('[2004] SetValue(' + k + ', ' + v + ')', true);
    return 'true';
  },
  Commit: function () {
    if (!scorm2004Initialized) { lastError2004 = '142'; logCall('[2004] Commit()', false, 'no inicializado'); return 'false'; }
    lastError2004 = '0';
    logCall('[2004] Commit()', true);
    return 'true';
  },
  GetLastError: function () { return lastError2004; },
  GetErrorString: function () { return ''; },
  GetDiagnostic: function () { return ''; },
};

// Historial de las últimas llamadas a la API (1.2 o 2004), con argumentos
// y si devolvió éxito o no — reemplaza el status-log de una sola línea que
// en QA resultó casi ilegible y no dejaba ver nada salvo la última llamada.
const API_LOG_MAX = 6;
const apiLogEntries = [];
function logCall(msg, ok, note) {
  apiLogEntries.push({ msg, ok, note });
  if (apiLogEntries.length > API_LOG_MAX) apiLogEntries.shift();
  const el = document.getElementById('apiLogPanel');
  if (!el) return;
  el.innerHTML = apiLogEntries
    .map((e) => `<div class="${e.ok ? 'ok' : 'err'}">${e.ok ? '✓' : '✗'} ${escapeHtml(e.msg)}${e.note ? ' — ' + escapeHtml(e.note) : ''}</div>`)
    .join('');
  el.scrollTop = el.scrollHeight;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

(function init() {
  const params = new URLSearchParams(window.location.search);
  const src = params.get('src');
  const name = params.get('name');
  if (name) document.getElementById('courseTitle').textContent = name;

  if (!src) {
    document.getElementById('playerBody').innerHTML = '<div class="error-box">Falta el parámetro "src" con la URL del paquete SCORM.</div>';
    return;
  }
  document.getElementById('scormFrame').src = src;
})();
</script>
</body>
</html>
